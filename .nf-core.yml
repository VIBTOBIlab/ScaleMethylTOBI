repository_type: pipeline

nf_core_version: 4.2.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-scalemethyltobi_logo_light.png
    - docs/images/nf-core-scalemethyltobi_logo_light.png
    - docs/images/nf-core-scalemethyltobi_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - assets/sendmail_template.txt
    - docs/CONTRIBUTING.md
    # Extended with the pipeline-specific entries (outputs, MkDocs site)
    - .gitignore
    # The GitHub repository is VIBTOBIlab/ScaleMethylTOBI (the template uses the lower-case pipeline name)
    - .github/workflows/branch.yml
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-scalemethyltobi_logo_light.png
    - docs/images/nf-core-scalemethyltobi_logo_light.png
    - docs/images/nf-core-scalemethyltobi_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    # Pipeline download test removed (fails on missing test_full profile)
    - .github/workflows/download_pipeline.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
    # No full-size test dataset is available
    - conf/test_full.config
  # The test data is stored in the repository (tests/data), not in nf-core/test-datasets
  nf_test_content:
    - tests/nextflow.config

template:
  org: VIBTOBIlab
  name: scalemethyltobi
  description: ScaleBio single-cell DNA methylation analysis workflow
  author: ScaleBio, VIBTOBIlab
  version: 1.6.1
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
    - codespaces
  is_nfcore: false
