report_comment: >
  This report has been generated by the <a href="https://github.com/VIBTOBIlab/ScaleMethylTOBI" target="_blank">VIBTOBIlab/scalemethyltobi</a>
  analysis pipeline. It summarises the read QC (FastQC, per input fastq file), the adapter trimming (cutadapt) and the
  alignment (samtools flagstat) per sample and Tn5 well. The per-cell QC is in the sample and library reports (report/).
report_section_order:
  fastqc:
    order: 1000
  cutadapt:
    order: 900
  samtools:
    order: 800

# The cutadapt input files are named /dev/fd/...: use the log file names (<sample>.<well>.trim_log)
use_filename_as_sample_name:
  - cutadapt

extra_fn_clean_exts:
  - ".trim_log"
  - ".flagstat"

export_plots: false
